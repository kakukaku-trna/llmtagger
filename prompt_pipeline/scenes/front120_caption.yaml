name: front120_caption
display_name: 单前视 Front120 驾驶视频描述
version: 1.0

data:
  mode: local
  positive_dir: ""
  negative_dir: ""

inference:
  engine: dashscope
  model: qwen3.7-plus
  workers: 3
  timeout_per_sample: 90
  fps: 2
  thinking_budget: 1024
  max_retries: 3
  response_mode: text
  api_key: ${DASHSCOPE_API_KEY}
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

target:
  accuracy: 0
  recall: 0
  precision: 0

iteration:
  max_rounds: 1
  eval_sample_size: 20
  full_eval_on_final: false
  improve_topk: 0
  early_stop:
    no_improvement_rounds: 1
    token_budget_exceeded: true

token_budget:
  per_sample_max: 30000
  total_per_round_max: 500000
  total_pipeline_max: 1000000
  alert_threshold: 0.8

alerts:
  email: huajiang.sun@nio.com

caption:
  min_chars: 0
  max_chars: 0
  max_attempts: 1
