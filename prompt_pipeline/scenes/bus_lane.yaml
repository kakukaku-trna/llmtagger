name: bus_lane
display_name: 公交车道检测 (Bus Lane Detection)
version: 1.0

data:
  mode: local
  positive_dir: /home/huajiang.sun/model_muse/bus_lane_pos
  negative_dir: ""   # 暂无负样本，仅测 recall；若需完整 P/R/F1 请补充负样本目录

inference:
  engine: dashscope
  model: qwen3.7-plus
  workers: 5
  timeout_per_sample: 60
  fps: 2
  thinking_budget: 512
  max_retries: 3
  api_key: ${DASHSCOPE_API_KEY}
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

target:
  precision: 85
  recall: 85

iteration:
  max_rounds: 3
  eval_sample_size: 50
  full_eval_on_final: true
  improve_topk: 3
  early_stop:
    no_improvement_rounds: 2
    token_budget_exceeded: true

token_budget:
  per_sample_max: 3000
  total_per_round_max: 300000
  total_pipeline_max: 900000
  alert_threshold: 0.8

alerts:
  email: huajiang.sun@nio.com
