name: you_feijidongchedao
display_name: 有非机动车道检测

data:
  mode: local
  positive_dir: /home/huajiang.sun/data/有非机动车道
  negative_dir: /home/huajiang.sun/data/晴天

inference:
  engine: dashscope
  model: qwen3.7-plus
  workers: 5
  timeout_per_sample: 60
  fps: 2
  thinking_budget: 512
  max_retries: 3
  api_key: ${DASHSCOPE_API_KEY}
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1

target:
  recall: 80
  precision: 85

iteration:
  max_rounds: 5
  eval_sample_size: 4    # 仅 2 正样本，极小评估集（数据量不足，建议补充数据）
  full_eval_on_final: true
  improve_topk: 3
  early_stop:
    no_improvement_rounds: 2
    token_budget_exceeded: true

token_budget:
  per_sample_max: 25000
  total_per_round_max: 500000
  total_pipeline_max: 2000000
  alert_threshold: 0.8

alerts:
  email: huajiang.sun@nio.com
